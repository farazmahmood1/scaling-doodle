    <!-- Preconnect / DNS prefetch for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Sitemap discovery -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

      name="description"
      content="Codilated is an AI-first digital agency building AI automation, websites and web apps, Shopify and WordPress stores, branding, social media and marketing that grows revenue."

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <meta property="og:site_name" content="Codilated" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Codilated, AI, Web, E-Commerce & Marketing Agency" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Codilated — AI automation, web development, e-commerce, branding and marketing agency" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="An AI-first digital agency building AI automation, websites, Shopify and WordPress stores, branding, social media and marketing that grows revenue." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>Codilated, AI, Web, E-Commerce & Marketing Agency</title>
  </head>
